name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily rebuild: publishes articles whose pubDate has arrived (04:10 UTC = early morning in Paris).
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run article:check
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 1

  preview:
    name: Preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/preview
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}

  deploy-relay:
    name: Deploy the Slack relay
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:relay
      - id: secrets
        env:
          CONFIGURED: ${{ secrets.SLACK_SIGNING_SECRET != '' && secrets.SLACK_BOT_TOKEN != '' && secrets.GH_DISPATCH_TOKEN != '' }}
        run: echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        env:
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/slack-relay
          command: deploy
          secrets: |
            SLACK_SIGNING_SECRET
            SLACK_BOT_TOKEN
            GH_DISPATCH_TOKEN
      - if: steps.secrets.outputs.configured != 'true'
        run: echo "Slack relay not deployed - add SLACK_SIGNING_SECRET, SLACK_BOT_TOKEN and GH_DISPATCH_TOKEN" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://clementbresson.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
